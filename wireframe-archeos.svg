<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="4300" viewBox="0 0 1440 4300" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe complet de la landing page Archeos</title>
  <desc id="desc">Wireframe desktop vertical representant les sections Hero, Concept, Video Titanic, Shorts et Equipe.</desc>

  <defs>
    <style>
      .bg { fill: #070504; }
      .section { fill: #0c0908; stroke: #312015; stroke-width: 1; }
      .panel { fill: #120d0a; stroke: #ca8a24; stroke-opacity: .45; stroke-width: 2; }
      .panel-soft { fill: #100d0b; stroke: #8c672f; stroke-opacity: .45; stroke-width: 1.5; }
      .media { fill: #17100c; stroke: #ca8a24; stroke-opacity: .32; stroke-width: 2; }
      .abyss { fill: #061015; stroke: #4b8790; stroke-opacity: .35; stroke-width: 2; }
      .line { stroke: #ca8a24; stroke-opacity: .34; stroke-width: 1.5; fill: none; }
      .muted-line { stroke: #e6d3a8; stroke-opacity: .16; stroke-width: 1; fill: none; }
      .text { fill: #f0dfc2; font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .mono { fill: #ca8a24; font-family: "Courier New", monospace; letter-spacing: 2px; }
      .muted { fill: #b5a78d; font-family: Arial, Helvetica, sans-serif; }
      .label { fill: #ca8a24; font-family: "Courier New", monospace; font-size: 18px; letter-spacing: 3px; }
      .small { font-size: 18px; }
      .body { font-size: 24px; }
      .h1 { font-size: 94px; font-weight: 700; }
      .h2 { font-size: 64px; font-weight: 700; }
      .h3 { font-size: 28px; font-weight: 700; }
      .ghost { fill: #f0dfc2; opacity: .045; font-family: Arial, Helvetica, sans-serif; font-size: 180px; font-weight: 700; }
      .note { fill: #8f836f; font-family: "Courier New", monospace; font-size: 15px; letter-spacing: 1px; }
      .dot { fill: #ca8a24; }
      .cyan { stroke: #75aeb6; stroke-opacity: .55; }
    </style>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#130d09" />
      <stop offset=".55" stop-color="#080605" />
      <stop offset="1" stop-color="#2b170b" />
    </linearGradient>
    <radialGradient id="abyssGrad" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#102732" />
      <stop offset=".42" stop-color="#071217" />
      <stop offset="1" stop-color="#020506" />
    </radialGradient>
  </defs>

  <rect class="bg" width="1440" height="4300" />

  <!-- Global navigation -->
  <rect x="48" y="32" width="1344" height="72" rx="20" class="panel-soft" />
  <circle cx="92" cy="68" r="18" class="dot" opacity=".7" />
  <text x="126" y="76" class="text h3">ARCHEOS</text>
  <text x="602" y="77" class="mono small">CONCEPT</text>
  <text x="738" y="77" class="mono small">VIDEO</text>
  <text x="844" y="77" class="mono small">SHORTS</text>
  <rect x="1216" y="48" width="130" height="40" rx="20" class="panel" />
  <text x="1245" y="75" class="mono small">YOUTUBE</text>

  <!-- Hero -->
  <g id="wire-hero" transform="translate(0 130)">
    <rect x="48" y="0" width="1344" height="720" rx="36" fill="url(#heroGrad)" stroke="#312015" />
    <text x="120" y="150" class="ghost">ARCHEOS</text>
    <path d="M60 520 C350 430 580 620 820 500 S1180 450 1380 560" class="line" />
    <path d="M210 0 L620 720 M1220 0 L840 720 M720 0 L720 720" class="muted-line" />
    <circle cx="1160" cy="170" r="90" fill="none" stroke="#ca8a24" stroke-opacity=".18" stroke-width="2" />
    <polygon points="230,560 285,645 175,645" fill="none" stroke="#ca8a24" stroke-opacity=".32" stroke-width="2" />
    <text x="120" y="300" class="text h1">ARCHEOS</text>
    <text x="122" y="354" class="muted body">Experience de vulgarisation cinematique.</text>
    <text x="122" y="390" class="muted body">Scans, archives et reconstructions 3D.</text>
    <rect x="120" y="440" width="190" height="56" rx="28" class="panel" />
    <text x="154" y="476" class="mono small">VOIR L'EPISODE</text>
    <rect x="330" y="440" width="230" height="56" rx="28" class="panel-soft" />
    <text x="360" y="476" class="mono small">ENTRER STRATE</text>
    <text x="1180" y="660" class="note">Parallax + glow + scanlines</text>
  </g>

  <!-- Concept -->
  <g id="wire-concept" transform="translate(0 920)">
    <rect x="48" y="0" width="1344" height="660" rx="30" class="section" />
    <text x="96" y="150" class="ghost">01</text>
    <text x="120" y="140" class="label">01 - CONCEPT DE CHAINE</text>
    <text x="120" y="220" class="text h2">Ce que nous creons.</text>
    <text x="122" y="280" class="muted body">Archeologie ancienne + technologie + narration visuelle.</text>
    <rect x="780" y="110" width="250" height="270" rx="12" class="panel" />
    <text x="810" y="164" class="mono small">A01</text>
    <text x="810" y="214" class="text h3">Thematique</text>
    <line x1="810" y1="250" x2="990" y2="250" class="muted-line" />
    <line x1="810" y1="285" x2="970" y2="285" class="muted-line" />
    <rect x="1060" y="150" width="250" height="270" rx="12" class="panel-soft" />
    <text x="1090" y="204" class="mono small">A02</text>
    <text x="1090" y="254" class="text h3">Editorial</text>
    <line x1="1090" y1="290" x2="1270" y2="290" class="muted-line" />
    <line x1="1090" y1="325" x2="1250" y2="325" class="muted-line" />
    <rect x="780" y="420" width="530" height="150" rx="12" class="panel" />
    <text x="810" y="475" class="mono small">A03</text>
    <text x="890" y="475" class="text h3">Promesse : artifact numerique</text>
    <text x="810" y="525" class="muted small">Trace -> donnee -> reconstruction -> comprehension</text>
  </g>

  <!-- Video / Titanic -->
  <g id="wire-video" transform="translate(0 1660)">
    <rect x="48" y="0" width="1344" height="900" rx="34" fill="url(#abyssGrad)" stroke="#15333c" />
    <text x="112" y="115" class="label">02 - VIDEO PRINCIPALE</text>
    <text x="112" y="195" class="text h2">Titanic, le releve impossible.</text>
    <text x="114" y="250" class="muted body">Rupture abyssale : scene 3D, scan curseur, archive video.</text>
    <ellipse cx="720" cy="545" rx="500" ry="185" fill="none" class="cyan" stroke-width="2" />
    <path d="M360 540 C500 480 850 470 1060 555" fill="none" stroke="#75aeb6" stroke-opacity=".55" stroke-width="8" />
    <path d="M410 535 L1010 535" stroke="#ca8a24" stroke-opacity=".5" stroke-width="2" stroke-dasharray="12 10" />
    <text x="540" y="500" class="note">Modele 3D Titanic / fallback image</text>
    <rect x="145" y="680" width="240" height="120" rx="10" class="abyss" />
    <text x="170" y="725" class="mono small">DEPTH 3800M</text>
    <text x="170" y="760" class="mono small">NORTH ATLANTIC</text>
    <rect x="1080" y="660" width="210" height="54" rx="27" class="panel" />
    <text x="1110" y="695" class="mono small">DEVERROUILLER</text>
    <rect x="420" y="675" width="600" height="165" rx="12" class="panel-soft" />
    <rect x="450" y="715" width="540" height="95" rx="8" class="media" />
    <text x="610" y="775" class="text h3">Archive video YouTube</text>
    <text x="1100" y="830" class="note">Reveal: cinema panel</text>
  </g>

  <!-- Shorts -->
  <g id="wire-shorts" transform="translate(0 2640)">
    <rect x="48" y="0" width="1344" height="620" rx="30" class="section" />
    <text x="96" y="125" class="ghost">03</text>
    <text x="120" y="120" class="label">03 - CONTENUS COURTS</text>
    <text x="120" y="200" class="text h2">Les Shorts.</text>
    <text x="820" y="145" class="muted body">Capsules verticales : detail, hypothese, image qui accroche.</text>
    <rect x="120" y="290" width="330" height="250" rx="10" class="panel" />
    <circle cx="285" cy="380" r="52" fill="none" stroke="#ca8a24" stroke-opacity=".35" stroke-width="3" />
    <text x="155" y="485" class="mono small">#SHORT 01</text>
    <text x="155" y="520" class="text h3">Scan coque</text>
    <rect x="555" y="245" width="330" height="295" rx="10" class="panel-soft" />
    <circle cx="720" cy="355" r="52" fill="none" stroke="#7c6a2c" stroke-opacity=".45" stroke-width="3" />
    <text x="590" y="485" class="mono small">#SHORT 02</text>
    <text x="590" y="520" class="text h3">Epave vivante</text>
    <rect x="990" y="290" width="330" height="250" rx="10" class="panel" />
    <circle cx="1155" cy="380" r="52" fill="none" stroke="#e6d3a8" stroke-opacity=".22" stroke-width="3" />
    <text x="1025" y="485" class="mono small">#SHORT 03</text>
    <text x="1025" y="520" class="text h3">Fragment -> scene</text>
  </g>

  <!-- Team / CTA -->
  <g id="wire-team" transform="translate(0 3340)">
    <rect x="48" y="0" width="1344" height="820" rx="34" class="section" />
    <text x="210" y="220" class="ghost">EQUIPE</text>
    <text x="610" y="105" class="label">04 - EQUIPE</text>
    <text x="365" y="185" class="text h2">Ceux qui portent l'expedition.</text>
    <text x="410" y="235" class="muted body">Carrousel circulaire 3D, rotation continue, pause au hover carte.</text>
    <ellipse cx="720" cy="500" rx="510" ry="185" fill="none" stroke="#ca8a24" stroke-opacity=".22" stroke-width="2" />
    <ellipse cx="720" cy="500" rx="360" ry="120" fill="none" stroke="#f0dfc2" stroke-opacity=".12" stroke-width="1" />
    <g class="team-card">
      <rect x="610" y="300" width="220" height="265" rx="6" class="panel" />
      <rect x="630" y="320" width="180" height="130" rx="4" class="media" />
      <text x="650" y="485" class="mono small">MEMBRE 01</text>
      <text x="650" y="525" class="text h3">Nom / role</text>
    </g>
    <rect x="250" y="370" width="170" height="210" rx="6" class="panel-soft" opacity=".72" />
    <rect x="1020" y="370" width="170" height="210" rx="6" class="panel-soft" opacity=".72" />
    <rect x="455" y="255" width="150" height="190" rx="6" class="panel-soft" opacity=".5" />
    <rect x="835" y="255" width="150" height="190" rx="6" class="panel-soft" opacity=".5" />
    <rect x="465" y="590" width="150" height="170" rx="6" class="panel-soft" opacity=".35" />
    <rect x="825" y="590" width="150" height="170" rx="6" class="panel-soft" opacity=".35" />
    <text x="118" y="760" class="note">Photos equipe dans public/team + cadrage par nth-child CSS</text>
  </g>

  <!-- Footer note -->
  <text x="48" y="4258" class="note">Wireframe SVG - structure actuelle de la landing page Archeos - desktop first</text>
</svg>
